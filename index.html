<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World Cars Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #ffffff;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        #speedometer {
            color: #38bdf8;
            font-family: monospace;
            font-size: 18px;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 68px;
            height: 68px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
        }
        .btn:active {
            background: rgba(56, 189, 248, 0.85);
            border-color: #38bdf8;
            transform: scale(0.92);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>جاري تشغيل اللعبة المحدثة... 🎮</h2>
    </div>

    <div id="game-container"></div>

    <div id="ui">
        <div class="hud-card">💰 <span id="coins-display">0</span></div>
        <div class="hud-card" id="speedometer">0 KM/H</div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-brake">⬇</div>
            <div class="btn" id="btn-gas">⬆</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // --- نظام الصوت الاصطناعي (Audio Synthesizer) ---
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(30, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playCoinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function updateEngineSound(currentSpeed) {
            if (!engineOsc) return;
            const pitch = 30 + Math.abs(currentSpeed) * 120;
            engineOsc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        }

        // --- إعداد المشهد الرسومي Three.js ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        sunLight.position.set(100, 150, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        const textureLoader = new THREE.TextureLoader();

        // الأرضية
        const grassTex = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTex.wrapS = THREE.RepeatWrapping;
        grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(40, 40);

        const grassGeo = new THREE.PlaneGeometry(600, 600);
        const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.receiveShadow = true;
        scene.add(grass);

        // الشوارع والمباني
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

        const worldSize = 600;
        const roadSpacing = 120;
        const roadWidth = 20;

        for (let pos = -worldSize / 2 + 60; pos <= worldSize / 2 - 60; pos += roadSpacing) {
            const roadV = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, worldSize), roadMat);
            roadV.rotation.x = -Math.PI / 2;
            roadV.position.set(pos, 0.02, 0);
            roadV.receiveShadow = true;
            scene.add(roadV);

            const lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.5, worldSize), lineMat);
            lineV.rotation.x = -Math.PI / 2;
            lineV.position.set(pos, 0.03, 0);
            scene.add(lineV);

            const roadH = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, roadWidth), roadMat);
            roadH.rotation.x = -Math.PI / 2;
            roadH.position.set(0, 0.02, pos);
            roadH.receiveShadow = true;
            scene.add(roadH);

            const lineH = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, 0.5), lineMat);
            lineH.rotation.x = -Math.PI / 2;
            lineH.position.set(0, 0.03, pos);
            scene.add(lineH);
        }

        // تكستشر المباني
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, 256, 512);
            ctx.fillStyle = '#fef08a';
            for (let y = 20; y < 500; y += 40) {
                for (let x = 20; x < 240; x += 35) {
                    if (Math.random() > 0.3) ctx.fillRect(x, y, 20, 25);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        const bTexture = createBuildingTexture();
        bTexture.wrapS = THREE.RepeatWrapping;
        bTexture.wrapT = THREE.RepeatWrapping;

        const colliders = [];

        // إنشاء المباني والبيئة الجانبية (أشجار وأعمدة إضاءة)
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6 });
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8 });

        for (let bx = -worldSize / 2 + 60; bx < worldSize / 2 - 60; bx += roadSpacing) {
            for (let bz = -worldSize / 2 + 60; bz < worldSize / 2 - 60; bz += roadSpacing) {
                const bWidth = 36;
                const bDepth = 36;
                const bHeight = 35 + Math.random() * 30;
                const cx = bx + roadSpacing / 2;
                const cz = bz + roadSpacing / 2;

                const bGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
                const bMat = new THREE.MeshStandardMaterial({ map: bTexture, roughness: 0.4 });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(cx, bHeight / 2, cz);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                colliders.push({ x: cx, z: cz, radius: 20 });

                // إضافة أشجار حول المباني
                for (let i = 0; i < 2; i++) {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), trunkMat);
                    trunk.position.y = 1.5;
                    tree.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 5, 8), leavesMat);
                    leaves.position.y = 4;
                    leaves.castShadow = true;
                    tree.add(leaves);

                    const tx = cx + (Math.random() - 0.5) * 50;
                    const tz = cz + (Math.random() - 0.5) * 50;
                    tree.position.set(tx, 0, tz);
                    scene.add(tree);
                }
            }
        }

        // إنشاء العملات الذهبية (Coins)
        const coins = [];
        const coinGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

        for (let i = 0; i < 40; i++) {
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            const rx = (Math.floor(Math.random() * 4) - 1.5) * roadSpacing;
            const rz = (Math.random() - 0.5) * (worldSize - 100);
            coin.position.set(rx, 1.2, rz);
            coin.castShadow = true;
            scene.add(coin);
            coins.push(coin);
        }

        // إنشاء السيارة وأضوائها
        const car = new THREE.Group();
        const paintMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.7, roughness: 0.2 });
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.2), paintMat);
        body.position.y = 0.5;
        body.castShadow = true;
        car.add(body);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2.1), glassMat);
        cabin.position.set(0, 1.1, -0.3);
        car.add(cabin);

        // العجلات
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 24);
        const wPos = [[-1.1, 0.4, 1.2], [1.1, 0.4, 1.2], [-1.1, 0.4, -1.2], [1.1, 0.4, -1.2]];
        wPos.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, blackMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            w.castShadow = true;
            car.add(w);
        });

        // الأضواء الأمامية والخلفية للسيارة
        const lightMatFront = new THREE.MeshBasicMaterial({ color: 0xffffcc });
        const lightMatBack = new THREE.MeshBasicMaterial({ color: 0x550000 });

        const headLightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), lightMatFront);
        headLightL.position.set(-0.7, 0.6, 2.1);
        car.add(headLightL);

        const headLightR = headLightL.clone();
        headLightR.position.x = 0.7;
        car.add(headLightR);

        const brakeLightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), lightMatBack);
        brakeLightL.position.set(-0.7, 0.6, -2.1);
        car.add(brakeLightL);

        const brakeLightR = brakeLightL.clone();
        brakeLightR.position.x = 0.7;
        car.add(brakeLightR);

        scene.add(car);

        // متغيرات الحركة والتحكم
        let speed = 0;
        let maxSpeed = 1.1;
        let accel = 0.018;
        let friction = 0.009;
        let angle = 0;
        let turnAngle = 0;
        let totalCoins = 0;

        const keys = { gas: false, brake: false, left: false, right: false };

        function bindControl(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); initAudio(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }

        bindControl('btn-gas', 'gas');
        bindControl('btn-brake', 'brake');
        bindControl('btn-left', 'left');
        bindControl('btn-right', 'right');

        function animate() {
            requestAnimationFrame(animate);

            // الفيزياء والتسارع
            if (keys.gas) {
                speed = Math.min(speed + accel, maxSpeed);
                lightMatBack.color.setHex(0x550000); // أضواء خلفية عادية
            } else if (keys.brake) {
                speed = Math.max(speed - accel, -maxSpeed / 2);
                lightMatBack.color.setHex(0xff0000); // إضاءة أضواء الفرامل باللون الأحمر الساطع
            } else {
                lightMatBack.color.setHex(0x550000);
                if (speed > 0) speed = Math.max(0, speed - friction);
                if (speed < 0) speed = Math.min(0, speed + friction);
            }

            updateEngineSound(speed);

            turnAngle = 0;
            if (keys.left) turnAngle = 0.35;
            if (keys.right) turnAngle = -0.35;

            if (Math.abs(speed) > 0.01) {
                const dir = speed > 0 ? 1 : -1;
                angle += turnAngle * 0.065 * dir;
            }

            const nextX = car.position.x + Math.sin(angle) * speed;
            const nextZ = car.position.z + Math.cos(angle) * speed;

            // التصادم مع المباني
            let collide = false;
            for (let c of colliders) {
                if (Math.hypot(nextX - c.x, nextZ - c.z) < c.radius) {
                    collide = true;
                    break;
                }
            }

            if (!collide) {
                car.position.x = nextX;
                car.position.z = nextZ;
            } else {
                speed = -speed * 0.3;
            }

            car.rotation.y = angle;

            // دوران وفحص جمع العملات الذهبية
            coins.forEach(coin => {
                if (coin.visible) {
                    coin.rotation.z += 0.04;
                    if (Math.hypot(car.position.x - coin.position.x, car.position.z - coin.position.z) < 2.5) {
                        coin.visible = false;
                        totalCoins += 10;
                        document.getElementById('coins-display').innerText = totalCoins;
                        playCoinSound();
                    }
                }
            });

            // الكاميرا
            const camOffset = new THREE.Vector3(0, 3.2, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            camera.position.copy(car.position).add(camOffset);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            document.getElementById('speedometer').innerText = Math.round(Math.abs(speed) * 150) + " KM/H";

            renderer.render(scene, camera);
        }

        setTimeout(() => {
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            animate();
        }, 800);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
