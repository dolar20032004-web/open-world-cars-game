<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World Cars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* واجهة المستخدم Top UI */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
        }
        #speedometer {
            color: #00ffcc;
        }
        /* أزرار التحكم للموبايل Mobile Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(0, 255, 204, 0.6);
            transform: scale(0.95);
        }
        #btn-cam {
            position: absolute;
            top: 70px;
            right: 15px;
            width: 45px;
            height: 45px;
            font-size: 14px;
            border-radius: 10px;
            pointer-events: auto;
        }
    </style>
    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui">
        <div class="hud-card">💰 <span id="coins">100</span> Coins</div>
        <div class="hud-card" id="speedometer">0 KM/H</div>
    </div>

    <button class="btn" id="btn-cam">📷</button>

    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-brake">⬇</div>
            <div class="btn" id="btn-gas">⬆</div>
        </div>
    </div>

    <script>
        // إعداد المشهد والكاميرا
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.Fog(0xa0a0a0, 20, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // الأرضية / الشارع
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // إنشاء بعض المباني للبيئة
        for(let i = 0; i < 30; i++) {
            const h = Math.random() * 20 + 10;
            const bGeo = new THREE.BoxGeometry(10, h, 10);
            const bMat = new THREE.MeshStandardMaterial({ color: 0x667788 });
            const building = new THREE.Mesh(bGeo, bMat);
            const x = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;
            if(Math.abs(x) > 15 || Math.abs(z) > 15) {
                building.position.set(x, h/2, z);
                building.castShadow = true;
                scene.add(building);
            }
        }

        // إنشاء سيارة مبسطة
        const car = new THREE.Group();
        
        // جسم السيارة
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        carBody.castShadow = true;
        car.add(carBody);

        // سقف السيارة
        const roofGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const carRoof = new THREE.Mesh(roofGeo, roofMat);
        carRoof.position.set(0, 1.2, -0.2);
        car.add(carRoof);

        scene.add(car);

        // متغيرات الحركة والفيزياء
        let speed = 0;
        let maxSpeed = 0.8;
        let accel = 0.015;
        let friction = 0.008;
        let turnSpeed = 0.03;
        let angle = 0;

        // حالة الأزرار
        const keys = { gas: false, brake: false, left: false, right: false };

        function bindTouch(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', () => { keys[key] = true; });
            btn.addEventListener('mouseup', () => { keys[key] = false; });
        }

        bindTouch('btn-gas', 'gas');
        bindTouch('btn-brake', 'brake');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // تحديث الحركة والكاميرا
        function animate() {
            requestAnimationFrame(animate);

            // التسارع والفرامل
            if (keys.gas) speed = Math.min(speed + accel, maxSpeed);
            else if (keys.brake) speed = Math.max(speed - accel, -maxSpeed / 2);
            else {
                if (speed > 0) speed = Math.max(0, speed - friction);
                if (speed < 0) speed = Math.min(0, speed + friction);
            }

            // التوجيه
            if (Math.abs(speed) > 0.01) {
                const dir = speed > 0 ? 1 : -1;
                if (keys.left) angle += turnSpeed * dir;
                if (keys.right) angle -= turnSpeed * dir;
            }

            car.rotation.y = angle;
            car.position.x += Math.sin(angle) * speed;
            car.position.z += Math.cos(angle) * speed;

            // الكاميرا خلف السيارة
            const camOffset = new THREE.Vector3(0, 3, -7).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            camera.position.copy(car.position).add(camOffset);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            // عداد السرعة
            document.getElementById('speedometer').innerText = Math.round(Math.abs(speed) * 120) + " KM/H";

            renderer.render(scene, camera);
        }

        animate();

        // إعادة الضبط عند تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
