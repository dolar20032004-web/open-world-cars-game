<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World Cars Telegram v8.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* شاشات القوائم */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #ffffff;
            transition: opacity 0.4s ease;
            padding: 20px;
        }
        
        .menu-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 20px 30px;
            width: 80%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .menu-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #38bdf8;
        }

        .menu-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .main-btn {
            width: 100%;
            padding: 12px 18px;
            margin: 6px 0;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .main-btn:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, #0369a1, #075985);
        }
        .main-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* متجر السيارات */
        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .shop-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-item-info {
            text-align: right;
        }
        .shop-item-name {
            font-size: 14px;
            font-weight: 700;
        }
        .shop-item-price {
            font-size: 12px;
            color: #facc15;
        }

        /* واجهة اللعب HUD */
        #ui {
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        #speedometer {
            color: #38bdf8;
            font-family: monospace;
            font-size: 15px;
        }

        /* أزرار التحكم للشاشة العريضة */
        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .btn {
            width: 70px;
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }
        .btn:active {
            background: rgba(56, 189, 248, 0.85);
            border-color: #38bdf8;
            transform: scale(0.92);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div class="overlay-screen" id="main-menu">
        <div class="menu-card">
            <div class="menu-title">سيارات العراق 3D</div>
            <div class="menu-subtitle">الوضع العريض - تجربة قيادة واقعية</div>
            <button class="main-btn" id="btn-start-game">▶ ابدأ اللعب</button>
            <button class="main-btn secondary" id="btn-open-shop">🏎️ متجر السيارات</button>
        </div>
    </div>

    <!-- متجر السيارات -->
    <div class="overlay-screen" id="shop-menu" style="display: none;">
        <div class="menu-card">
            <div class="menu-title">متجر السيارات</div>
            <div class="menu-subtitle">رصيدك: 💰 <span id="shop-coins-display">0</span></div>
            
            <div class="shop-items">
                <div class="shop-item">
                    <div class="shop-item-info">
                        <div class="shop-item-name">سيارة المدينة</div>
                        <div class="shop-item-price">مجاناً</div>
                    </div>
                    <button class="main-btn" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="selectCar(0)">مجهزة</button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <div class="shop-item-name">تاكسي بغداد 🚕</div>
                        <div class="shop-item-price">💰 100 عملة</div>
                    </div>
                    <button class="main-btn secondary" id="buy-btn-1" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="buyCar(1, 100)">شراء</button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <div class="shop-item-name">سيارة سبورت 🏎️</div>
                        <div class="shop-item-price">💰 250 عملة</div>
                    </div>
                    <button class="main-btn secondary" id="buy-btn-2" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="buyCar(2, 250)">شراء</button>
                </div>
            </div>

            <button class="main-btn secondary" id="btn-close-shop">الرجوع للقائمة</button>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- واجهة القيادة -->
    <div id="ui">
        <div class="hud-card">💰 <span id="coins-display">0</span></div>
        <button class="hud-card" id="btn-toggle-night" style="cursor: pointer;">☀️ نهار</button>
        <button class="hud-card" id="btn-pause-menu" style="cursor: pointer;">⚙️</button>
        <div class="hud-card" id="speedometer">0 KM/H</div>
    </div>

    <!-- التحكم -->
    <div class="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-brake">⬇</div>
            <div class="btn" id="btn-gas">⬆</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }
            if (typeof tg.setOrientation === 'function') {
                tg.setOrientation('landscape');
            } else if (typeof tg.lockOrientation === 'function') {
                tg.lockOrientation('landscape');
            }
        }

        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        // --- محاكي الصوت (Audio Synthesizer) ---
        let audioCtx = null;
        let engineOsc1 = null;
        let engineOsc2 = null;
        let engineFilter = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            engineOsc1 = audioCtx.createOscillator();
            engineOsc2 = audioCtx.createOscillator();
            engineFilter = audioCtx.createBiquadFilter();
            const engineGain = audioCtx.createGain();

            engineOsc1.type = 'triangle';
            engineOsc2.type = 'sine';

            engineFilter.type = 'lowpass';
            engineFilter.frequency.setValueAtTime(140, audioCtx.currentTime);

            engineGain.gain.setValueAtTime(0.07, audioCtx.currentTime);

            engineOsc1.connect(engineFilter);
            engineOsc2.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);

            engineOsc1.start();
            engineOsc2.start();
        }

        function playCoinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(650, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1300, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function updateEngineSound(currentSpeed) {
            if (!engineOsc1 || !audioCtx) return;
            const normSpeed = Math.abs(currentSpeed);
            const freq1 = 25 + normSpeed * 70;
            const freq2 = 50 + normSpeed * 140;
            const cutoff = 120 + normSpeed * 400;

            engineOsc1.frequency.setTargetAtTime(freq1, audioCtx.currentTime, 0.05);
            engineOsc2.frequency.setTargetAtTime(freq2, audioCtx.currentTime, 0.05);
            engineFilter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.05);
        }

        // --- Three.js Setup ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.003);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        sunLight.position.set(100, 150, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        const textureLoader = new THREE.TextureLoader();

        // الأرضية
        const grassTex = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTex.wrapS = THREE.RepeatWrapping;
        grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(40, 40);

        const grass = new THREE.Mesh(
            new THREE.PlaneGeometry(600, 600),
            new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 })
        );
        grass.rotation.x = -Math.PI / 2;
        grass.receiveShadow = true;
        scene.add(grass);

        // الطرق والأرصفة والمطبات
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const curbMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
        const bumpMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });

        const worldSize = 600;
        const roadSpacing = 120;
        const roadWidth = 20;

        for (let pos = -worldSize / 2 + 60; pos <= worldSize / 2 - 60; pos += roadSpacing) {
            const roadV = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, worldSize), roadMat);
            roadV.rotation.x = -Math.PI / 2;
            roadV.position.set(pos, 0.02, 0);
            roadV.receiveShadow = true;
            scene.add(roadV);

            const lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.5, worldSize), lineMat);
            lineV.rotation.x = -Math.PI / 2;
            lineV.position.set(pos, 0.03, 0);
            scene.add(lineV);

            const roadH = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, roadWidth), roadMat);
            roadH.rotation.x = -Math.PI / 2;
            roadH.position.set(0, 0.02, pos);
            roadH.receiveShadow = true;
            scene.add(roadH);

            const lineH = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, 0.5), lineMat);
            lineH.rotation.x = -Math.PI / 2;
            lineH.position.set(0, 0.03, pos);
            scene.add(lineH);

            const bump = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, roadWidth, 12), bumpMat);
            bump.rotation.z = Math.PI / 2;
            bump.position.set(pos, 0.1, pos + 35);
            scene.add(bump);
        }

        // إشارات المرور
        const trafficLights = [];
        const redMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const greenMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

        for (let bx = -worldSize / 2 + 60; bx < worldSize / 2 - 60; bx += roadSpacing) {
            for (let bz = -worldSize / 2 + 60; bz < worldSize / 2 - 60; bz += roadSpacing) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 7), curbMat);
                pole.position.set(bx + roadWidth / 2 + 2, 3.5, bz + roadWidth / 2 + 2);

                const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), roadMat);
                box.position.set(bx + roadWidth / 2 + 2, 6, bz + roadWidth / 2 + 2);

                const lightMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), redMat);
                lightMesh.position.set(bx + roadWidth / 2 + 2, 6.2, bz + roadWidth / 2 + 1.5);

                scene.add(pole);
                scene.add(box);
                scene.add(lightMesh);

                trafficLights.push(lightMesh);
            }
        }

        setInterval(() => {
            trafficLights.forEach(tl => {
                tl.material = Math.random() > 0.5 ? greenMat : redMat;
            });
        }, 4000);

        // المباني والأشجار
        const colliders = [];
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6 });

        for (let bx = -worldSize / 2 + 60; bx < worldSize / 2 - 60; bx += roadSpacing) {
            for (let bz = -worldSize / 2 + 60; bz < worldSize / 2 - 60; bz += roadSpacing) {
                const bWidth = 36;
                const bDepth = 36;
                const bHeight = 35 + Math.random() * 30;
                const cx = bx + roadSpacing / 2;
                const cz = bz + roadSpacing / 2;

                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(bWidth, bHeight, bDepth),
                    new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 })
                );
                building.position.set(cx, bHeight / 2, cz);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                colliders.push({ x: cx, z: cz, radius: 20 });

                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2), trunkMat);
                trunk.position.y = 1;
                tree.add(trunk);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4.5, 8), leavesMat);
                leaves.position.y = 3.25;
                leaves.castShadow = true;
                tree.add(leaves);
                tree.position.set(cx + 15, 0, cz + 15);
                scene.add(tree);
            }
        }

        // العملات
        const coins = [];
        const coinGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

        for (let i = 0; i < 40; i++) {
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            const rx = (Math.floor(Math.random() * 4) - 1.5) * roadSpacing;
            const rz = (Math.random() - 0.5) * (worldSize - 100);
            coin.position.set(rx, 1.2, rz);
            coin.castShadow = true;
            scene.add(coin);
            coins.push(coin);
        }

        // بناء السيارات
        function createCarMesh(colorHex, isTaxi = false) {
            const cGroup = new THREE.Group();
            const paintMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.7, roughness: 0.2 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.8 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.2), paintMat);
            body.position.y = 0.5;
            body.castShadow = true;
            cGroup.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2.1), glassMat);
            cabin.position.set(0, 1.1, -0.3);
            cGroup.add(cabin);

            if (isTaxi) {
                const taxiSign = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.4), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
                taxiSign.position.set(0, 1.6, -0.3);
                cGroup.add(taxiSign);
            }

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 24);
            const wPos = [[-1.1, 0.4, 1.2], [1.1, 0.4, 1.2], [-1.1, 0.4, -1.2], [1.1, 0.4, -1.2]];
            wPos.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, blackMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(...pos);
                w.castShadow = true;
                cGroup.add(w);
            });

            return cGroup;
        }

        const carsData = [
            { id: 0, color: 0x0284c7, maxSpeed: 1.1, isTaxi: false, name: "عادية" },
            { id: 1, color: 0xeab308, maxSpeed: 1.3, isTaxi: true, name: "تاكسي" },
            { id: 2, color: 0xdc2626, maxSpeed: 1.6, isTaxi: false, name: "سبورت" }
        ];

        let selectedCarIndex = 0;
        let unlockedCars = [true, false, false];
        let totalCoins = 0;

        let car = createCarMesh(carsData[0].color, false);
        scene.add(car);

        function updateCarModel(index) {
            scene.remove(car);
            selectedCarIndex = index;
            car = createCarMesh(carsData[index].color, carsData[index].isTaxi);
            scene.add(car);
        }

        function selectCar(index) {
            if (unlockedCars[index]) {
                updateCarModel(index);
                alert("تم تجهيز السيارة بنجاح!");
            }
        }

        function buyCar(index, price) {
            if (totalCoins >= price) {
                totalCoins -= price;
                unlockedCars[index] = true;
                document.getElementById('coins-display').innerText = totalCoins;
                document.getElementById('shop-coins-display').innerText = totalCoins;
                document.getElementById(`buy-btn-${index}`).innerText = "مجهزة";
                document.getElementById(`buy-btn-${index}`).className = "main-btn";
                updateCarModel(index);
            } else {
                alert("عذراً، لا تمتلك عملات كافية للشراء!");
            }
        }

        // الذكاء الاصطناعي
        const trafficCars = [];
        for (let i = 0; i < 5; i++) {
            const aiCar = createCarMesh(0x64748b, false);
            aiCar.position.set((i - 2) * roadSpacing + 4, 0, (Math.random() - 0.5) * 300);
            scene.add(aiCar);
            trafficCars.push({ mesh: aiCar, speed: 0.3 });
        }

        // الليل والنهار
        let isNight = false;
        document.getElementById('btn-toggle-night').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.setHex(0x020617);
                scene.fog.color.setHex(0x020617);
                ambientLight.intensity = 0.15;
                sunLight.intensity = 0.1;
                document.getElementById('btn-toggle-night').innerText = "🌙 ليل";
            } else {
                scene.background.setHex(0x38bdf8);
                scene.fog.color.setHex(0x38bdf8);
                ambientLight.intensity = 0.8;
                sunLight.intensity = 1.2;
                document.getElementById('btn-toggle-night').innerText = "☀️ نهار";
            }
        });

        // القوائم
        document.getElementById('btn-start-game').addEventListener('click', () => {
            initAudio();
            document.getElementById('main-menu').style.display = 'none';
        });

        document.getElementById('btn-open-shop').addEventListener('click', () => {
            document.getElementById('shop-coins-display').innerText = totalCoins;
            document.getElementById('shop-menu').style.display = 'flex';
        });

        document.getElementById('btn-close-shop').addEventListener('click', () => {
            document.getElementById('shop-menu').style.display = 'none';
        });

        document.getElementById('btn-pause-menu').addEventListener('click', () => {
            document.getElementById('main-menu').style.display = 'flex';
        });

        // الفيزياء والتحكم
        let speed = 0;
        let accel = 0.018;
        let friction = 0.009;
        let angle = 0;

        const keys = { gas: false, brake: false, left: false, right: false };

        function bindControl(id, key) {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); initAudio(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }

        bindControl('btn-gas', 'gas');
        bindControl('btn-brake', 'brake');
        bindControl('btn-left', 'left');
        bindControl('btn-right', 'right');

        function animate() {
            requestAnimationFrame(animate);

            const currentMaxSpeed = carsData[selectedCarIndex].maxSpeed;

            if (keys.gas) {
                speed = Math.min(speed + accel, currentMaxSpeed);
            } else if (keys.brake) {
                speed = Math.max(speed - accel, -currentMaxSpeed / 2);
            } else {
                if (speed > 0) speed = Math.max(0, speed - friction);
                if (speed < 0) speed = Math.min(0, speed + friction);
            }

            updateEngineSound(speed);

            let turnAngle = 0;
            if (keys.left) turnAngle = 0.35;
            if (keys.right) turnAngle = -0.35;

            if (Math.abs(speed) > 0.01) {
                const dir = speed > 0 ? 1 : -1;
                angle += turnAngle * 0.065 * dir;
            }

            const nextX = car.position.x + Math.sin(angle) * speed;
            const nextZ = car.position.z + Math.cos(angle) * speed;

            let collide = false;
            for (let c of colliders) {
                if (Math.hypot(nextX - c.x, nextZ - c.z) < c.radius) {
                    collide = true;
                    break;
                }
            }

            if (!collide) {
                car.position.x = nextX;
                car.position.z = nextZ;
            } else {
                speed = -speed * 0.3;
            }

            car.rotation.y = angle;

            trafficCars.forEach(tc => {
                tc.mesh.position.z += tc.speed;
                if (tc.mesh.position.z > worldSize / 2) tc.mesh.position.z = -worldSize / 2;
            });

            coins.forEach(coin => {
                if (coin.visible) {
                    coin.rotation.z += 0.04;
                    if (Math.hypot(car.position.x - coin.position.x, car.position.z - coin.position.z) < 2.5) {
                        coin.visible = false;
                        totalCoins += 10;
                        document.getElementById('coins-display').innerText = totalCoins;
                        playCoinSound();
                    }
                }
            });

            const camOffset = new THREE.Vector3(0, 2.8, -7).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            camera.position.copy(car.position).add(camOffset);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);

            document.getElementById('speedometer').innerText = Math.round(Math.abs(speed) * 150) + " KM/H";

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
